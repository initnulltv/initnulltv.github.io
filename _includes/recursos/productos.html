<section id="productos" class="py-16 sm:py-24 bg-slate-900 text-white">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <h2 class="text-3xl sm:text-4xl font-bold logo-text brand-gradient-text mb-10 text-center">
      ⚓ Productos
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      {% for item in site.data.productos %}
      <div class="bg-slate-800 p-6 rounded-xl shadow-2xl border border-[var(--color-{{ item.color }})]
                  hover:ring-2 hover:ring-[var(--color-{{ item.color }})]
                  hover:shadow-[var(--color-{{ item.color }}]]/50
                  transition-all duration-300">

        {% if item.icono %}
        <img src="{{ item.icono }}" alt="{{ item.nombre }}" 
             class="w-full h-48 object-cover rounded-lg mb-4
                    transform transition-transform duration-300 hover:scale-105">
        {% endif %}

        <h3 class="logo-text text-xl mb-2 text-{{ item.color }}">{{ item.nombre }}</h3>
        <p class="text-gris-claro mb-4 text-sm">{{ item.descripcion }}</p>
        <a href="{{ item.enlace }}" target="_blank" 
           class="inline-flex items-center text-{{ item.color }} hover:underline font-semibold text-sm
                  transition-all duration-300 hover:-translate-y-1">
          {{ item.botonprod | default: "Ver producto →" }}
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</section>

{% assign post = include.post %}
<article class="bg-slate-800 rounded-2xl shadow-md hover:shadow-lg transition-shadow border border-slate-700 hover:border-[#007BFF]/50">
    
    {% if post.image %}
    <a href="{{ post.url | relative_url }}">
        <div class="relative w-full overflow-hidden rounded-t-2xl" style="aspect-ratio: 16 / 9;">
            <img 
                src="{{ post.image | relative_url }}" 
                alt="Banner para la publicación {{ post.title }}"
                class="absolute inset-0 w-full h-full object-cover transition duration-300 ease-in-out transform hover:scale-105"
            >
        </div>
    </a>
    {% endif %}

    <div class="p-6">
        <h2 class="text-xl font-semibold text-white mb-2">
            <a href="{{ post.url | relative_url }}" class="hover:text-[#007BFF] transition-colors font-titulos">
                {{ post.title }}
            </a>
        </h2>
        <p class="text-slate-400 text-sm mb-4">{{ post.date | date: "%d %b %Y" }}</p>
        <p class="text-slate-300 text-sm">{{ post.excerpt | strip_html | truncate: 120 }}</p>
        <a href="{{ post.url | relative_url }}" class="inline-block mt-4 text-[#007BFF] text-sm font-medium hover:underline font-subtitulo">
            Leer más →
        </a>
    </div>
</article>

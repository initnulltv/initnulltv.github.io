<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<meta name="author" content="InitNullTV">
<meta name="theme-color" content="#007BFF">

{% seo %}

<meta property="og:locale" content="es">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta name="keywords" content="{{ page.tags | join: ', ' }}">

{% if page.image %}
  <meta property="og:image" content="{{ site.url }}{{ page.image | relative_url }}">
  <meta name="twitter:image" content="{{ site.url }}{{ page.image | relative_url }}">
{% else %}
  <meta property="og:image" content="{{ site.url }}/assets/img/og/initnulltv-og.jpg">
  <meta name="twitter:image" content="{{ site.url }}/assets/img/og/initnulltv-og.jpg">
{% endif %}

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@InitNullTV">
<meta name="twitter:creator" content="@InitNullTV">

<link rel="apple-touch-icon" sizes="57x57" href="{{ '/assets/favicon/apple-icon-57x57.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon/favicon-16x16.png' | relative_url }}">
<link rel="manifest" href="{{ '/assets/favicon/manifest.json' | relative_url }}">
<meta name="msapplication-TileColor" content="#007BFF">

<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preload" href="{{ '/assets/css/output.css' | relative_url }}" as="style" onload="this.rel='stylesheet'">
<link rel="stylesheet" href="{{ '/assets/css/output.css' | relative_url }}" media="all">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

<link rel="preload" href="{{ '/assets/fonts/roboto-regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/orbitron-regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>

<script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>

<link rel="alternate" type="application/atom+xml" href="{{ site.url }}/feed.xml" title="{{ site.title }}">
<link rel="canonical" href="{{ site.url }}{{ page.url | relative_url }}">

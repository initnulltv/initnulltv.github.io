<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<meta name="author" content="InitNullTV">
<meta name="theme-color" content="#007BFF">

{% seo %}
<meta property="og:locale" content="es">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta name="keywords" content="{{ page.tags | join: ', ' }}">

{% if page.image %}
<meta property="og:image" content="{{ site.url }}{{ page.image | relative_url }}">
<meta name="twitter:image" content="{{ site.url }}{{ page.image | relative_url }}">
{% else %}
 <meta property="og:image" content="{{ site.url }}/assets/img/og/initnulltv-og.jpg">
 <meta name="twitter:image" content="{{ site.url }}/assets/img/og/initnulltv-og.jpg">
{% endif %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@InitNullTV">
<meta name="twitter:creator" content="@InitNullTV">

<style>
:root {
  --color-negro-profundo: #0D0D0D; 
  --color-gris-claro: #E5E7EB; 
  --font-base: 'Roboto', sans-serif;
  --font-titulos: 'Orbitron', sans-serif;
}

body {
  background-color: var(--color-negro-profundo);
  color: var(--color-gris-claro);
  font-family: var(--font-base);
  line-height: 1.6;
  margin: 0;
  padding: 0;
}

h1, h2, h3, h4, .logo-text {
  font-family: var(--font-titulos);
}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://s3.amazonaws.com"> 
<link rel="preconnect" href="https://downloads.mailchimp.com">

<link rel="apple-touch-icon" sizes="57x57" href="{{ '/assets/favicon/apple-icon-57x57.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon/favicon-16x16.png' | relative_url }}">
<link rel="manifest" href="{{ '/assets/favicon/manifest.json' | relative_url }}">
<meta name="msapplication-TileColor" content="#007BFF">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Orbitron:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer"></noscript>

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}"></noscript>

<script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
<script src="https://s3.amazonaws.com/downloads.mailchimp.com/js/mc-validate.js" defer></script>

<link rel="alternate" type="application/atom+xml" href="{{ site.url }}/feed.xml" title="{{ site.title }}">
<link rel="canonical" href="{{ site.url }}{{ page.url | relative_url }}">

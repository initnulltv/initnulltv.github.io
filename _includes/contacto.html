<section id="contacto" class="py-16 sm:py-24 bg-slate-900 text-white dark:bg-black-profundo">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-2xl">
    <h2 class="text-3xl sm:text-4xl font-bold text-center mb-8 brand-gradient-text logo-text">
      Envíame un mensaje
    </h2>
    <p class="text-center text-slate-400 mb-10 subtitle">
      ¿Tienes una idea, colaboración o duda sobre InitNullTV? <br>Déjala aquí y te responderé pronto.
    </p>

    <form id="contactForm" action="https://formsubmit.co/contacto@initnulltv.com" method="POST" class="space-y-6">
      <input type="hidden" name="_next" value="https://initnulltv.com/gracias">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_subject" value="Nuevo mensaje">
      <input type="text" name="_honey" style="display:none">

      <div>
        <label for="nombre" class="block mb-2 text-gray-300 font-medium">Nombre</label>
        <input type="text" id="nombre" name="nombre" required
          class="w-full bg-slate-800 border border-turquesa/40 focus:border-turquesa rounded-xl p-3 text-white outline-none transition-all">
      </div>

      <div>
        <label for="email" class="block mb-2 text-gray-300 font-medium">Correo electrónico</label>
        <input type="email" id="email" name="email" required
          class="w-full bg-slate-800 border border-turquesa/40 focus:border-turquesa rounded-xl p-3 text-white outline-none transition-all">
      </div>

      <div>
        <label for="mensaje" class="block mb-2 text-gray-300 font-medium">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="5" required
          class="w-full bg-slate-800 border border-turquesa/40 focus:border-turquesa rounded-xl p-3 text-white outline-none transition-all"></textarea>
      </div>

      <p class="text-center text-slate-400 text-sm mt-8">
        Si estás pasando por un momento difícil o te sientes sin rumbo, no lo enfrentes solo(a).  
        Puedes <a href="/contacto" class="text-[var(--color-verde-neon)] font-semibold hover:underline">escribirme</a>  
        o visitar <a href="https://findahelpline.com/es-ES" target="_blank" rel="noopener" class="text-[var(--color-verde-neon)] font-semibold hover:underline">findahelpline.com</a>  
        para recibir apoyo gratuito y confidencial.
      </p>

      <p id="formStatus" class="text-center text-slate-400 hidden"></p>

      <div class="mt-12 text-center">
        <button type="submit" id="submitBtn"
          class="inline-flex items-center justify-center cta-neon-green font-bold py-3 px-10 rounded-xl transition-all text-lg logo-text">
          <span id="btnIcon" style="font-size: 1.3em; line-height: 0.8em; margin-right: 8px;">&#x2709;</span>
          <span id="btnText">ENVIAR MENSAJE 🚀</span>
        </button>
      </div>
    </form>
  </div>
</section>

<script>
  const form = document.getElementById('contactForm');
  const status = document.getElementById('formStatus');
  const button = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');
  const btnIcon = document.getElementById('btnIcon');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btnText.textContent = 'ENVIANDO...';
    btnIcon.innerHTML = '⏳';
    button.disabled = true;
    status.classList.remove('hidden');
    status.textContent = 'Enviando mensaje...';

    try {
      const formData = new FormData(form);
      await fetch(form.action, {
        method: form.method,
        body: formData,
      });

      status.textContent = 'Mensaje enviado correctamente ✅';
      btnText.textContent = 'ENVIADO';
      btnIcon.innerHTML = '📨';

      setTimeout(() => {
        window.location.href = 'https://initnulltv.com/gracias';
      }, 1500);
    } catch {
      status.textContent = 'Error al enviar. Inténtalo nuevamente.';
      btnText.textContent = 'INTENTAR DE NUEVO';
      btnIcon.innerHTML = '⚠️';
      button.disabled = false;
    }
  });
</script>

<section id="opiniones" class="py-16 sm:py-24 bg-slate-900 text-white dark:bg-black-profundo">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-12">
      <h2 class="text-3xl sm:text-4xl font-bold brand-gradient-text logo-text">
        Opiniones de la comunidad
      </h2>
      <p class="mt-4 max-w-2xl mx-auto text-lg text-gris-claro subtitle">
        Estos comentarios son la prueba de que sí se puede emprender, juntos.
      </p>
    </div>

    <div class="relative mx-auto max-w-7xl">
      <div id="carrusel-opiniones"
           class="flex gap-6 overflow-x-scroll carousel-track snap-x snap-mandatory py-2 px-1">
        
        {% assign testimonios = site.data.testimonios %}
        {% for test in testimonios %}
        <div class="flex-shrink-0 snap-start min-w-[85%] sm:min-w-[48%] md:min-w-[32%] lg:min-w-[24%] xl:min-w-[19%]">
          <div class="progress-card testimonial-card h-full flex flex-col justify-between">
            <a href="{{ test.img }}" target="_blank">
              <img src="{{ test.img }}" alt="Testimonio de {{ test.nombre }}" class="w-full h-auto rounded-t-lg">
            </a>
            
          </div>
        </div>
        {% endfor %}
      </div>

      <button id="prev"
              class="carousel-nav-btn left-0 transform -translate-x-1/2 -translate-y-1/2 z-20">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>
      <button id="next"
              class="carousel-nav-btn right-0 transform translate-x-1/2 -translate-y-1/2 z-20">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    const carrusel = document.getElementById('carrusel-opiniones');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const gap = 24;

    function scrollStep() {
      const firstCard = carrusel.querySelector('.flex-shrink-0');
      if (!firstCard) return 0;
      return firstCard.offsetWidth + gap;
    }

    next.onclick = () => {
      carrusel.scrollBy({ left: scrollStep(), behavior: 'smooth' });
    };

    prev.onclick = () => {
      carrusel.scrollBy({ left: -scrollStep(), behavior: 'smooth' });
    };
  </script>
</section>

name: Build and Deploy Jekyll site

on:
  push:
    branches:
      - develop
      - design

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Install dependencies
        run: |
          # Asegura entorno compatible con GitHub Actions (Linux)
          bundle config set --local deployment false
          bundle config set frozen false
          bundle config set path 'vendor/bundle'
          bundle lock --add-platform x86_64-linux
          bundle install
          npm install

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge design into develop (temporal)
        if: github.ref == 'refs/heads/develop'
        run: |
          git fetch origin design
          git merge origin/design --allow-unrelated-histories -m "Merge design branch into develop (temp build)"

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true

name: Build and Deploy Jekyll site

# 🚀 Solo se ejecuta al hacer push en la rama 'develop'
on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 🔹 1. Clonar el repositorio completo (todas las ramas)
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 🔹 2. Configurar Ruby
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: false

      # 🔹 3. Instalar dependencias Ruby + Node
      - name: Install dependencies
        run: |
          gem install bundler
          bundle config set --local deployment false
          bundle config set frozen false
          bundle lock --add-platform x86_64-linux
          bundle install
          npm install

      # 🔹 4. Configurar identidad de Git (para despliegue)
      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 🔹 5. Compilar el sitio Jekyll
      - name: Build Jekyll site
        run: bundle exec jekyll build --trace

      # 🔹 6. Desplegar el contenido de _site al branch 'gh-pages'
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true

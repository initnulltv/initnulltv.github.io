# ==========================================
# 🌐 CONFIGURACIÓN GENERAL DEL SITIO
# ==========================================
title: "InitNullTV - Negocios digitales"
description: "Guía práctica para emprender desde cero y crear negocios digitales reales en Latinoamérica, sin humo ni falsas promesas."
url: "https://initnulltv.com"
baseurl: ""
language: "es"
author: "InitNullTV"
default_image: "/assets/img/og/initnulltv-og.jpg"
logo: "/assets/favicon/favicon-96x96.png"
brand_color: "#007BFF"
twitter_username: "@InitNullTV"
timezone: "America/Lima"

# ==========================================
# 🔗 ENLACES Y REDES SOCIALES
# ==========================================
links:
  youtube: "https://www.youtube.com/@InitNullTV"
  instagram: "https://instagram.com/initnulltv"
  tiktok: "https://tiktok.com/@initnulltv"
  twitter: "https://x.com/initnulltv"
  bluesky: "https://bsky.app/profile/initnulltv.com"
  linkedin_company: "https://www.linkedin.com/company/initnulltv"
  linkedin: "https://www.linkedin.com/in/wuilmerbolivar/"
  github: "https://github.com/initnulltv"
  patreon: "https://www.patreon.com/c/InitNullTV"
  whatsapp_channel: "https://whatsapp.com/channel/0029VbBFbf8KwqSQ2QjoVE2y"
  whatsapp_community: "https://chat.whatsapp.com/GXplv2gYMZP3sVUobdrVBN"
  telegram_channel: "https://t.me/initnulltv"
  telegram_group: "https://t.me/+oD-3607T9iliOTM5"
  discord_group: "https://discord.gg/Jg6aGhcnU6"

# ==========================================
# 📁 COLECCIONES PERSONALIZADAS
# ==========================================
collections:
  proyecto:
    output: true
  comunidad:
    output: true
  recursos:
    output: true
  multimedia:
    output: true
  contacto:
    output: true

# ==========================================
# ⚙️ VALORES POR DEFECTO
# ==========================================
defaults:
  # Posts en _posts/
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      feed: false
      image: "/assets/img/og/initnulltv-og.jpg"

  # Colecciones (todas las secciones personalizadas)
  - scope:
      path: "proyecto"
    values:
      layout: section
  - scope:
      path: "comunidad"
    values:
      layout: section
  - scope:
      path: "recursos"
    values:
      layout: section
  - scope:
      path: "multimedia"
    values:
      layout: section
  - scope:
      path: "contacto"
    values:
      layout: section

  # Páginas generales
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page
      image: "/assets/img/og/initnulltv-og.jpg"
      permalink: /:path/

# ==========================================
# ✍️ MARKDOWN Y ESTRUCTURA DE URL
# ==========================================
markdown: kramdown
highlighter: rouge
permalink: /:title/

# ==========================================
# 🔌 PLUGINS (Jekyll 4.4.1)
# ==========================================
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-minifier
  - jekyll-postcss-v2

# ==========================================
# 🚫 EXCLUSIONES DEL BUILD
# ==========================================
exclude:
  - vendor/
  - node_modules/
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - .bundle/
  - Gemfile.lock~

# ==========================================
# 🧩 POSTCSS (Tailwind / NPM)
# ==========================================
postcss:
  executable: ./node_modules/.bin/postcss.cmd
  script: node_modules/.bin/postcss
  config: postcss.config.js

# ==========================================
# 📚 PAGINACIÓN DEL BLOG
# ==========================================
paginate: 6
paginate_path: "/blog/page:num"

# ==========================================
# 🧭 CONFIGURACIÓN DE PLUGINS XML
# ==========================================
sitemap:
  filename: sitemap.xml
  